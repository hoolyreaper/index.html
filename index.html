<title>Mis Gastos — Fido</title>
<style>
  :root{
    --bg:#0b0d11;
    --bg-elevated:#12151b;
    --surface:#1a1e26;
    --surface-2:#20242e;
    --border:#272c37;
    --text:#eef0f3;
    --text-dim:#8b93a1;
    --text-faint:#5b6270;
    --accent:#3EB489;
    --accent-dim:#2c8a68;
    --danger:#EF4444;
    --warn:#EAB308;
    --radius-lg:18px;
    --radius-md:13px;
    --radius-sm:9px;
    --safe-top:env(safe-area-inset-top);
    --safe-bottom:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  body{margin:0; padding:0;}
  #app{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  header.topbar{
    padding:calc(14px + var(--safe-top)) 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    background:linear-gradient(180deg, var(--bg-elevated), var(--bg));
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }
  header.topbar .brand{font-size:15px; color:var(--text-dim); letter-spacing:0.2px;}
  header.topbar .month{font-size:19px; font-weight:600; text-transform:capitalize;}
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 16px calc(120px + var(--safe-bottom));
    -webkit-overflow-scrolling:touch;
  }
  h2.section-title{font-size:13px; color:var(--text-dim); font-weight:600; margin:22px 0 10px 2px;}
  h2.section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:16px;
    margin-bottom:12px;
  }
  .card.tight{padding:14px 16px;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stat-big{font-size:30px; font-weight:700; letter-spacing:-0.5px;}
  .stat-label{font-size:13px; color:var(--text-dim); margin-bottom:4px;}
  .stat-delta{font-size:13px; font-weight:600;}
  .stat-delta.up{color:var(--danger);}
  .stat-delta.down{color:var(--accent);}

  .progress-track{height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:10px;}
  .progress-fill{height:100%; border-radius:6px; background:var(--accent); transition:width .3s ease;}
  .progress-fill.over{background:var(--danger);}

  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 12px; border-radius:20px;
    background:var(--surface-2); color:var(--text);
    font-size:13px; font-weight:500; border:1px solid var(--border);
  }
  .dot{width:8px; height:8px; border-radius:50%; flex:none;}

  .cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .cat-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; padding:12px 6px; border-radius:var(--radius-md);
    background:var(--surface-2); border:1.5px solid transparent; color:var(--text);
    font-size:11.5px; text-align:center; line-height:1.2; font-weight:500;
    min-height:64px;
  }
  .cat-btn:active{transform:scale(0.96);}
  .cat-btn .sw{width:20px; height:20px; border-radius:7px;}

  button{font-family:inherit;}
  .btn{
    border:none; border-radius:var(--radius-md); padding:14px 18px;
    font-size:15px; font-weight:600; cursor:pointer; width:100%;
  }
  .btn-primary{background:var(--accent); color:#062017;}
  .btn-primary:active{background:var(--accent-dim);}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:rgba(239,68,68,0.12); color:var(--danger); border:1px solid rgba(239,68,68,0.3);}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}

  input, select, textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm); padding:12px 13px;
    font-size:16px; font-family:inherit; outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--accent);}
  label.field-label{display:block; font-size:12.5px; color:var(--text-dim); margin:12px 0 6px;}
  label.field-label:first-child{margin-top:0;}

  /* Tab bar */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:space-around;
    background:rgba(18,21,27,0.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:8px 6px calc(8px + var(--safe-bottom));
    z-index:20;
  }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-faint);
    font-size:10.5px; padding:4px 10px; flex:1;
  }
  .tab-btn svg{width:22px; height:22px;}
  .tab-btn.active{color:var(--accent);}
  .tab-btn.active svg{stroke:var(--accent);}

  .fab{
    position:fixed; right:20px; bottom:calc(72px + var(--safe-bottom));
    width:60px; height:60px; border-radius:50%;
    background:var(--accent); color:#062017;
    border:none; font-size:30px; font-weight:400;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(62,180,137,0.35);
    z-index:20;
  }
  .fab:active{transform:scale(0.94);}

  /* Modal / bottom sheet */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:none; align-items:flex-end; z-index:50;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--bg-elevated); width:100%;
    border-radius:22px 22px 0 0; border-top:1px solid var(--border);
    padding:10px 20px calc(20px + var(--safe-bottom));
    max-height:88vh; overflow-y:auto;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:6px auto 14px;}
  .sheet-title{font-size:17px; font-weight:700; margin-bottom:14px;}

  .amount-display{
    font-size:40px; font-weight:700; text-align:center; padding:14px 0 4px;
    letter-spacing:-1px;
  }
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0 16px;}
  .key{
    background:var(--surface-2); border:none; color:var(--text);
    border-radius:var(--radius-sm); padding:16px 0; font-size:20px; font-weight:600;
  }
  .key:active{background:var(--surface);}

  .list-item{
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .li-swatch{width:38px; height:38px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;}
  .li-body{flex:1; min-width:0;}
  .li-title{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .li-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .li-amount{font-size:14.5px; font-weight:700; flex:none;}

  .filter-row{display:flex; gap:8px; margin-bottom:14px;}
  .filter-row select{flex:1;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--text-dim); font-size:14px;}

  .badge{
    display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;
  }
  .badge.warn{background:rgba(234,179,8,0.15); color:var(--warn);}
  .badge.danger{background:rgba(239,68,68,0.15); color:var(--danger);}
  .badge.ok{background:rgba(62,180,137,0.15); color:var(--accent);}

  .donut-wrap{display:flex; align-items:center; gap:18px;}
  .donut-legend{flex:1; display:flex; flex-direction:column; gap:7px;}
  .legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .legend-row .lname{flex:1; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend-row .lval{font-weight:600;}

  .toast{
    position:fixed; left:50%; bottom:calc(150px + var(--safe-bottom)); transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:30px; font-size:13.5px; z-index:60;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    opacity:0; transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;}

  .icon-btn{background:none; border:none; color:var(--text-dim); padding:6px; font-size:18px;}
  .swipe-actions{display:flex; gap:8px; margin-top:8px;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">Mis Gastos · Fido</div>
      <div class="month" id="headerMonth">—</div>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <main id="main"></main>

  <button class="fab" onclick="openExpenseSheet()" aria-label="Registrar gasto">+</button>

  <nav class="tabbar">
    <button class="tab-btn" data-view="inicio" onclick="setView('inicio')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </button>
    <button class="tab-btn" data-view="historial" onclick="setView('historial')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13a9 9 0 1 0 2-6.7L3 8"/><path d="M12 7v5l3 3"/></svg>
      Historial
    </button>
    <button class="tab-btn" data-view="deudas" onclick="setView('deudas')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      Deudas
    </button>
    <button class="tab-btn" data-view="metas" onclick="setView('metas')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Metas
    </button>
  </nav>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ DATOS ============ */
const STORAGE_KEY = 'fidoGastos_v1';
const CATEGORIES = [
  {id:'mercado',        name:'Mercado / Hogar',        color:'#22C55E'},
  {id:'deudas',         name:'Préstamos / Deudas',     color:'#EF4444'},
  {id:'domicilios',     name:'Domicilios',             color:'#F97316'},
  {id:'calzado',        name:'Calzado / Ropa',         color:'#A855F7'},
  {id:'entretenimiento',name:'Entretenimiento',        color:'#3B82F6'},
  {id:'gym',            name:'Gym',                    color:'#EAB308'},
  {id:'recargas',       name:'Recargas',               color:'#06B6D4'},
  {id:'transporte',     name:'Transporte',             color:'#9CA3AF'},
  {id:'peluqueria',     name:'Peluquería',             color:'#EC4899'},
  {id:'aseo',           name:'Aseo personal',          color:'#86EFAC'},
  {id:'varios',         name:'Varios',                 color:'#D1D5DB'},
];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function defaultState(){
  return {
    expenses: [],
    incomes: [],
    debts: [
      {
        id: 'yogui',
        name: 'Yogui',
        originalAmount: 0,
        balance: 0,
        monthlyInterest: 1500000,
        paymentDay: 26,
        payments: [],
        note: 'Verifica el capital y saldo real — precárgalo tú.'
      }
    ],
    goals: { savingsGoal: 0, debtGoalId: null, debtGoalMonths: null },
    settings: { monthlyThreshold: 2500000 },
    seeded: true
  };
}

let state = loadState();
let currentView = 'inicio';
let historialFilter = { month: monthKey(new Date()), category: 'all' };
let expenseDraft = { amount: '', categoryId: null, date: todayISO(), description: '', notes: '' };

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){
    console.error('Error cargando datos', e);
    return defaultState();
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ============ UTILIDADES ============ */
function formatCOP(n){
  n = Math.round(Number(n)||0);
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('es-CO', {maximumFractionDigits:0});
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthKey(dOrStr){
  const d = (dOrStr instanceof Date) ? dOrStr : new Date(dOrStr+'T00:00:00');
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(mk){
  const [y,m] = mk.split('-').map(Number);
  return MESES[m-1] + ' ' + y;
}
function shiftMonth(mk, delta){
  let [y,m] = mk.split('-').map(Number);
  m += delta;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y+'-'+String(m).padStart(2,'0');
}
function catById(id){ return CATEGORIES.find(c=>c.id===id) || {id:'varios',name:'Varios',color:'#D1D5DB'}; }
function fmtDateHuman(iso){
  const d = new Date(iso+'T00:00:00');
  return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+'.';
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function sumExpenses(list){ return list.reduce((a,e)=>a+e.amount,0); }
function expensesForMonth(mk){ return state.expenses.filter(e=>monthKey(e.date)===mk); }
function incomesForMonth(mk){ return state.incomes.filter(i=>monthKey(i.date)===mk); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ NAVEGACIÓN ============ */
function setView(v){
  currentView = v;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  render();
}

function render(){
  document.getElementById('headerMonth').textContent = monthLabel(monthKey(new Date()));
  const main = document.getElementById('main');
  if(currentView==='inicio') main.innerHTML = viewInicio();
  else if(currentView==='historial') main.innerHTML = viewHistorial();
  else if(currentView==='deudas') main.innerHTML = viewDeudas();
  else if(currentView==='metas') main.innerHTML = viewMetas();
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===currentView));
}

/* ============ VISTA: INICIO / DASHBOARD ============ */
function viewInicio(){
  const mk = monthKey(new Date());
  const prevMk = shiftMonth(mk, -1);
  const thisMonthExp = expensesForMonth(mk);
  const prevMonthExp = expensesForMonth(prevMk);
  const totalThis = sumExpenses(thisMonthExp);
  const totalPrev = sumExpenses(prevMonthExp);
  const totalIncome = sumExpenses(incomesForMonth(mk));
  const saldo = totalIncome - totalThis;
  const threshold = state.settings.monthlyThreshold || 0;
  const pct = threshold>0 ? Math.min(100, (totalThis/threshold)*100) : 0;
  const over = threshold>0 && totalThis>threshold;

  let deltaHtml = '';
  if(totalPrev>0){
    const diff = totalThis-totalPrev;
    const pctChange = Math.round((diff/totalPrev)*100);
    const cls = diff>=0?'up':'down';
    const arrow = diff>=0?'▲':'▼';
    deltaHtml = `<span class="stat-delta ${cls}">${arrow} ${Math.abs(pctChange)}% vs mes anterior</span>`;
  }

  // breakdown by category
  const byCat = {};
  thisMonthExp.forEach(e=>{ byCat[e.categoryId] = (byCat[e.categoryId]||0) + e.amount; });
  const sortedCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const donut = sortedCats.length ? renderDonut(sortedCats, totalThis) : `<div class="empty-state">Aún no hay gastos este mes.</div>`;

  // debt alerts
  const today = new Date().getDate();
  const dueSoon = state.debts.filter(d => d.paymentDay && (d.paymentDay - today >= 0 && d.paymentDay - today <= 3));

  return `
    <div class="card">
      <div class="stat-label">Gastado este mes</div>
      <div class="row">
        <div class="stat-big">${formatCOP(totalThis)}</div>
        ${deltaHtml}
      </div>
      <div class="progress-track"><div class="progress-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      ${threshold>0 ? `<div class="stat-sub" style="font-size:12px;color:var(--text-dim);margin-top:6px;">Meta mensual: ${formatCOP(threshold)} ${over?'· <span style=\"color:var(--danger);font-weight:600\">superada</span>':''}</div>` : `<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Configura un umbral en ⚙️</div>`}
    </div>

    <div class="card tight row">
      <div>
        <div class="stat-label">Ingresos del mes</div>
        <div style="font-size:19px;font-weight:700;">${formatCOP(totalIncome)}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="openIncomeSheet()">+ Ingreso</button>
    </div>

    <div class="card tight">
      <div class="stat-label">Saldo disponible</div>
      <div style="font-size:22px;font-weight:700; color:${saldo>=0?'var(--accent)':'var(--danger)'}">${formatCOP(saldo)}</div>
    </div>

    ${dueSoon.length ? `<div class="card" style="border-color:rgba(234,179,8,0.4);">
      ${dueSoon.map(d=>`<div class="row" style="margin-bottom:4px;"><span>💰 <b>${d.name}</b> — pago de interés en ${d.paymentDay-today<=0?'hoy':(d.paymentDay-today)+' días'}</span><span class="badge warn">Día ${d.paymentDay}</span></div>`).join('')}
    </div>` : ''}

    <h2 class="section-title">Gastos por categoría</h2>
    <div class="card">${donut}</div>
  `;
}

function renderDonut(sortedCats, total){
  const size=140, stroke=20, r=(size-stroke)/2, cx=size/2, cy=size/2, circumf=2*Math.PI*r;
  let offset=0;
  let arcs = '';
  sortedCats.forEach(([catId, amt])=>{
    const cat = catById(catId);
    const frac = amt/total;
    const len = frac*circumf;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cat.color}" stroke-width="${stroke}"
      stroke-dasharray="${len} ${circumf-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += len;
  });
  const legend = sortedCats.map(([catId,amt])=>{
    const cat = catById(catId);
    const pct = Math.round((amt/total)*100);
    return `<div class="legend-row"><span class="dot" style="background:${cat.color}"></span><span class="lname">${cat.name}</span><span class="lval">${pct}%</span></div>`;
  }).join('');
  return `<div class="donut-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
      ${arcs}
    </svg>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

/* ============ VISTA: HISTORIAL ============ */
function viewHistorial(){
  const months = getAvailableMonths();
  if(!months.includes(historialFilter.month)) historialFilter.month = monthKey(new Date());
  const list = state.expenses
    .filter(e => monthKey(e.date)===historialFilter.month && (historialFilter.category==='all' || e.categoryId===historialFilter.category))
    .sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
  const total = sumExpenses(list);

  const monthOptions = months.map(mk=>`<option value="${mk}" ${mk===historialFilter.month?'selected':''}>${monthLabel(mk)}</option>`).join('');
  const catOptions = `<option value="all">Todas las categorías</option>` + CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===historialFilter.category?'selected':''}>${c.name}</option>`).join('');

  const items = list.length ? list.map(e=>{
    const cat = catById(e.categoryId);
    return `<div class="list-item" onclick="openExpenseEdit('${e.id}')">
      <div class="li-swatch" style="background:${cat.color}22; color:${cat.color}">${cat.name[0]}</div>
      <div class="li-body">
        <div class="li-title">${e.description || cat.name}</div>
        <div class="li-sub">${fmtDateHuman(e.date)} · ${cat.name}</div>
      </div>
      <div class="li-amount">${formatCOP(e.amount)}</div>
    </div>`;
  }).join('') : `<div class="empty-state">Sin gastos registrados con este filtro.</div>`;

  return `
    <div class="filter-row">
      <select onchange="historialFilter.month=this.value; render()">${monthOptions}</select>
      <select onchange="historialFilter.category=this.value; render()">${catOptions}</select>
    </div>
    <div class="card tight row" style="margin-bottom:16px;">
      <span class="stat-label" style="margin:0;">Total del filtro</span>
      <span style="font-weight:700; font-size:16px;">${formatCOP(total)}</span>
    </div>
    <div class="card">${items}</div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn btn-ghost" onclick="exportBackup()">Exportar backup</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">Importar</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(this.files[0])">
  `;
}
function getAvailableMonths(){
  const set = new Set([monthKey(new Date())]);
  state.expenses.forEach(e=>set.add(monthKey(e.date)));
  state.incomes.forEach(i=>set.add(monthKey(i.date)));
  return Array.from(set).sort().reverse();
}

/* ============ VISTA: DEUDAS ============ */
function viewDeudas(){
  const today = new Date().getDate();
  const cards = state.debts.map(d=>{
    const paidTotal = d.payments.reduce((a,p)=>a+p.amount,0);
    const daysToPay = d.paymentDay ? d.paymentDay-today : null;
    let badge = '';
    if(daysToPay!==null){
      if(daysToPay<0) badge = `<span class="badge danger">Venció el ${d.paymentDay}</span>`;
      else if(daysToPay<=3) badge = `<span class="badge warn">Vence en ${daysToPay===0?'hoy':daysToPay+'d'}</span>`;
      else badge = `<span class="badge ok">Día ${d.paymentDay}</span>`;
    }
    return `<div class="card">
      <div class="row">
        <div style="font-weight:700; font-size:16px;">${d.name}</div>
        ${badge}
      </div>
      <div class="row" style="margin-top:10px;">
        <div>
          <div class="stat-label">Saldo pendiente</div>
          <div style="font-size:20px; font-weight:700;">${formatCOP(d.balance)}</div>
        </div>
        <div style="text-align:right;">
          <div class="stat-label">Interés mensual</div>
          <div style="font-size:15px; font-weight:600;">${formatCOP(d.monthlyInterest)}</div>
        </div>
      </div>
      <div style="font-size:12px; color:var(--text-dim); margin-top:8px;">Abonado histórico: ${formatCOP(paidTotal)} · ${d.payments.length} pago(s)</div>
      ${d.note ? `<div style="font-size:11.5px; color:var(--warn); margin-top:6px;">⚠️ ${d.note}</div>` : ''}
      <div class="swipe-actions">
        <button class="btn btn-primary btn-sm" onclick="openDebtPayment('${d.id}')">+ Abono</button>
        <button class="btn btn-ghost btn-sm" onclick="openDebtEdit('${d.id}')">Editar</button>
      </div>
    </div>`;
  }).join('');

  return `
    ${cards || `<div class="empty-state">No tienes deudas registradas.</div>`}
    <button class="btn btn-ghost" onclick="openDebtEdit(null)">+ Nueva deuda</button>
  `;
}

/* ============ VISTA: METAS ============ */
function viewMetas(){
  const mk = monthKey(new Date());
  const totalIncome = sumExpenses(incomesForMonth(mk));
  const totalExpense = sumExpenses(expensesForMonth(mk));
  const savedThisMonth = totalIncome - totalExpense;
  const g = state.goals;
  const savingsPct = g.savingsGoal>0 ? Math.min(100, Math.max(0,(savedThisMonth/g.savingsGoal)*100)) : 0;

  let debtGoalHtml = '';
  if(g.debtGoalId){
    const d = state.debts.find(x=>x.id===g.debtGoalId);
    if(d){
      const monthlyTarget = g.debtGoalMonths>0 ? d.balance/g.debtGoalMonths : 0;
      const paidThisMonth = sumExpenses(d.payments.filter(p=>monthKey(p.date)===mk).map(p=>({amount:p.amount})));
      const pct = monthlyTarget>0 ? Math.min(100,(paidThisMonth/monthlyTarget)*100) : 0;
      debtGoalHtml = `<div class="card">
        <div class="stat-label">Meta: liquidar ${d.name} en ${g.debtGoalMonths} meses</div>
        <div style="font-size:15px; margin:6px 0;">Abono mensual necesario: <b>${formatCOP(monthlyTarget)}</b></div>
        <div style="font-size:12.5px; color:var(--text-dim);">Este mes has abonado ${formatCOP(paidThisMonth)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>`;
    }
  }

  return `
    <div class="card">
      <div class="stat-label">Meta de ahorro mensual</div>
      <div style="font-size:20px; font-weight:700;">${formatCOP(g.savingsGoal)}</div>
      <div style="font-size:12.5px; color:var(--text-dim); margin-top:4px;">Llevas ahorrado: ${formatCOP(savedThisMonth)}</div>
      <div class="progress-track"><div class="progress-fill ${savedThisMonth<0?'over':''}" style="width:${savingsPct}%"></div></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="openSavingsGoal()">Editar meta</button>
    </div>

    ${debtGoalHtml}

    <button class="btn btn-ghost" onclick="openDebtGoal()">${g.debtGoalId ? 'Cambiar meta de deuda' : '+ Meta de pago de deuda'}</button>
  `;
}

/* ============ SHEETS / MODALES ============ */
function showSheet(html){
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
}
document.getElementById('sheetOverlay').addEventListener('click', function(e){
  if(e.target===this) closeSheet();
});

/* --- Registrar gasto rápido --- */
function openExpenseSheet(){
  expenseDraft = { amount:'', categoryId:null, date: todayISO(), description:'', notes:'' };
  renderExpenseSheet();
}
function renderExpenseSheet(){
  const catButtons = CATEGORIES.map(c=>`
    <button class="cat-btn" style="border-color:${expenseDraft.categoryId===c.id?c.color:'transparent'}" onclick="selectCategoryAndSave('${c.id}')">
      <span class="sw" style="background:${c.color}"></span>${c.name}
    </button>`).join('');

  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Nuevo gasto</div>
    <div class="amount-display" id="amountDisplay">${expenseDraft.amount ? formatCOP(expenseDraft.amount) : '$0'}</div>
    <div class="keypad">
      ${['1','2','3','4','5','6','7','8','9','000','0','⌫'].map(k=>`<button class="key" onclick="keypadPress('${k}')">${k}</button>`).join('')}
    </div>
    <input type="text" placeholder="Descripción (opcional)" value="${expenseDraft.description}" oninput="expenseDraft.description=this.value" style="margin-bottom:12px;">
    <div class="cat-grid">${catButtons}</div>
    <div style="font-size:12px; color:var(--text-dim); text-align:center; margin-top:14px;">Toca una categoría para guardar al instante</div>
  `);
}
function keypadPress(k){
  if(k==='⌫') expenseDraft.amount = expenseDraft.amount.slice(0,-1);
  else expenseDraft.amount = (expenseDraft.amount + k).slice(0,10);
  document.getElementById('amountDisplay').textContent = expenseDraft.amount ? formatCOP(expenseDraft.amount) : '$0';
}
function selectCategoryAndSave(catId){
  const amount = Number(expenseDraft.amount);
  if(!amount || amount<=0){
    toast('Escribe un monto primero');
    return;
  }
  state.expenses.push({
    id: uid(),
    date: expenseDraft.date,
    amount,
    categoryId: catId,
    description: expenseDraft.description.trim(),
    notes: '',
    createdAt: Date.now()
  });
  saveState();
  closeSheet();
  toast('Gasto guardado ✓');
  render();
}

/* --- Editar / eliminar gasto --- */
function openExpenseEdit(id){
  const e = state.expenses.find(x=>x.id===id);
  if(!e) return;
  const catOptions = CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===e.categoryId?'selected':''}>${c.name}</option>`).join('');
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Editar gasto</div>
    <label class="field-label">Monto</label>
    <input type="number" id="editAmount" value="${e.amount}">
    <label class="field-label">Fecha</label>
    <input type="date" id="editDate" value="${e.date}">
    <label class="field-label">Categoría</label>
    <select id="editCat">${catOptions}</select>
    <label class="field-label">Descripción</label>
    <input type="text" id="editDesc" value="${e.description||''}">
    <label class="field-label">Notas</label>
    <textarea id="editNotes" rows="2">${e.notes||''}</textarea>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn btn-primary" onclick="saveExpenseEdit('${id}')">Guardar</button>
      <button class="btn btn-danger" onclick="deleteExpense('${id}')">Eliminar</button>
    </div>
  `);
}
function saveExpenseEdit(id){
  const e = state.expenses.find(x=>x.id===id);
  e.amount = Number(document.getElementById('editAmount').value)||0;
  e.date = document.getElementById('editDate').value;
  e.categoryId = document.getElementById('editCat').value;
  e.description = document.getElementById('editDesc').value.trim();
  e.notes = document.getElementById('editNotes').value.trim();
  saveState();
  closeSheet();
  toast('Cambios guardados');
  render();
}
function deleteExpense(id){
  state.expenses = state.expenses.filter(x=>x.id!==id);
  saveState();
  closeSheet();
  toast('Gasto eliminado');
  render();
}

/* --- Ingresos --- */
function openIncomeSheet(){
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Registrar ingreso</div>
    <label class="field-label">Monto</label>
    <input type="number" id="incAmount" placeholder="0">
    <label class="field-label">Fecha</label>
    <input type="date" id="incDate" value="${todayISO()}">
    <label class="field-label">Fuente</label>
    <select id="incSource">
      <option value="Dope Tech">Retiro de Dope Tech</option>
      <option value="Otro">Otro ingreso</option>
    </select>
    <label class="field-label">Notas</label>
    <input type="text" id="incNotes" placeholder="Opcional">
    <button class="btn btn-primary" style="margin-top:18px;" onclick="saveIncome()">Guardar ingreso</button>
  `);
}
function saveIncome(){
  const amount = Number(document.getElementById('incAmount').value)||0;
  if(amount<=0){ toast('Escribe un monto válido'); return; }
  state.incomes.push({
    id: uid(),
    date: document.getElementById('incDate').value,
    amount,
    source: document.getElementById('incSource').value,
    notes: document.getElementById('incNotes').value.trim()
  });
  saveState();
  closeSheet();
  toast('Ingreso guardado ✓');
  render();
}

/* --- Deudas --- */
function openDebtPayment(debtId){
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Registrar abono</div>
    <label class="field-label">Monto</label>
    <input type="number" id="payAmount" placeholder="0">
    <label class="field-label">Fecha</label>
    <input type="date" id="payDate" value="${todayISO()}">
    <label class="field-label">Nota</label>
    <input type="text" id="payNote" placeholder="Opcional">
    <button class="btn btn-primary" style="margin-top:18px;" onclick="saveDebtPayment('${debtId}')">Guardar abono</button>
  `);
}
function saveDebtPayment(debtId){
  const d = state.debts.find(x=>x.id===debtId);
  const amount = Number(document.getElementById('payAmount').value)||0;
  if(amount<=0){ toast('Escribe un monto válido'); return; }
  d.payments.push({ date: document.getElementById('payDate').value, amount, note: document.getElementById('payNote').value.trim() });
  d.balance = Math.max(0, d.balance - amount);
  saveState();
  closeSheet();
  toast('Abono registrado ✓');
  render();
}
function openDebtEdit(debtId){
  const d = debtId ? state.debts.find(x=>x.id===debtId) : { id:null, name:'', originalAmount:0, balance:0, monthlyInterest:0, paymentDay:'', payments:[], note:'' };
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">${debtId?'Editar deuda':'Nueva deuda'}</div>
    <label class="field-label">Nombre</label>
    <input type="text" id="dName" value="${d.name}">
    <label class="field-label">Monto original</label>
    <input type="number" id="dOriginal" value="${d.originalAmount}">
    <label class="field-label">Saldo pendiente</label>
    <input type="number" id="dBalance" value="${d.balance}">
    <label class="field-label">Interés mensual</label>
    <input type="number" id="dInterest" value="${d.monthlyInterest}">
    <label class="field-label">Día de pago (1-31)</label>
    <input type="number" id="dDay" min="1" max="31" value="${d.paymentDay}">
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn btn-primary" onclick="saveDebt('${debtId||''}')">Guardar</button>
      ${debtId ? `<button class="btn btn-danger" onclick="deleteDebt('${debtId}')">Eliminar</button>` : ''}
    </div>
  `);
}
function saveDebt(debtId){
  const name = document.getElementById('dName').value.trim();
  if(!name){ toast('Ponle un nombre a la deuda'); return; }
  const data = {
    name,
    originalAmount: Number(document.getElementById('dOriginal').value)||0,
    balance: Number(document.getElementById('dBalance').value)||0,
    monthlyInterest: Number(document.getElementById('dInterest').value)||0,
    paymentDay: Number(document.getElementById('dDay').value)||null,
  };
  if(debtId){
    Object.assign(state.debts.find(x=>x.id===debtId), data, {note:''});
  } else {
    state.debts.push(Object.assign({id:uid(), payments:[], note:''}, data));
  }
  saveState();
  closeSheet();
  toast('Deuda guardada ✓');
  render();
}
function deleteDebt(debtId){
  state.debts = state.debts.filter(x=>x.id!==debtId);
  if(state.goals.debtGoalId===debtId) state.goals.debtGoalId=null;
  saveState();
  closeSheet();
  toast('Deuda eliminada');
  render();
}

/* --- Metas --- */
function openSavingsGoal(){
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Meta de ahorro mensual</div>
    <label class="field-label">Monto objetivo</label>
    <input type="number" id="savGoal" value="${state.goals.savingsGoal||0}">
    <button class="btn btn-primary" style="margin-top:18px;" onclick="saveSavingsGoal()">Guardar</button>
  `);
}
function saveSavingsGoal(){
  state.goals.savingsGoal = Number(document.getElementById('savGoal').value)||0;
  saveState();
  closeSheet();
  render();
}
function openDebtGoal(){
  const options = state.debts.map(d=>`<option value="${d.id}" ${state.goals.debtGoalId===d.id?'selected':''}>${d.name}</option>`).join('');
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Meta de pago de deuda</div>
    <label class="field-label">Deuda</label>
    <select id="goalDebt">${options}</select>
    <label class="field-label">Liquidar en (meses)</label>
    <input type="number" id="goalMonths" value="${state.goals.debtGoalMonths||6}">
    <button class="btn btn-primary" style="margin-top:18px;" onclick="saveDebtGoal()">Guardar meta</button>
  `);
}
function saveDebtGoal(){
  state.goals.debtGoalId = document.getElementById('goalDebt').value;
  state.goals.debtGoalMonths = Number(document.getElementById('goalMonths').value)||1;
  saveState();
  closeSheet();
  render();
}

/* --- Ajustes --- */
function openSettings(){
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Ajustes</div>
    <label class="field-label">Umbral de alerta mensual</label>
    <input type="number" id="setThreshold" value="${state.settings.monthlyThreshold||0}">
    <button class="btn btn-primary" style="margin-top:18px;" onclick="saveSettings()">Guardar</button>
    <div style="margin-top:22px; font-size:12px; color:var(--text-dim); line-height:1.6;">
      Todos tus datos se guardan solo en este iPhone (localStorage). Usa "Exportar backup" en Historial para respaldarlos.
    </div>
  `);
}
function saveSettings(){
  state.settings.monthlyThreshold = Number(document.getElementById('setThreshold').value)||0;
  saveState();
  closeSheet();
  toast('Ajustes guardados');
  render();
}

/* --- Backup --- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mis-gastos-backup-'+todayISO()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup exportado');
}
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      state = Object.assign(defaultState(), data);
      saveState();
      toast('Backup importado ✓');
      render();
    }catch(err){
      toast('Archivo inválido');
    }
  };
  reader.readAsText(file);
}

/* ============ INICIO ============ */
render();
</script>
